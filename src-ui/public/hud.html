<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    #hud {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(9,9,11,0.88);
      border: 1px solid #6366f1;
      border-radius: 8px;
      padding: 6px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.recording { background: #22c55e; animation: pulse 1s ease-in-out infinite; }
    .dot.transcribing { background: #eab308; }
    .dot.injecting { background: #6366f1; }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.5; transform:scale(1.3); }
    }
    .spinner {
      width: 10px; height: 10px;
      border: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    .spinner.transcribing { border-top-color: #eab308; border-right-color: #eab30880; }
    .spinner.injecting    { border-top-color: #6366f1; border-right-color: #6366f180; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label {
      font-size: 11px;
      color: #f4f4f5;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="dot recording" id="dot"></div>
    <span class="label" id="label">Recording…</span>
  </div>
  <script>
    // FR-07: receive state from main process via postMessage (no preload needed)
    window.addEventListener('message', (e) => {
      if (!e.data || !e.data.state) return;
      const dot   = document.getElementById('dot');
      const label = document.getElementById('label');
      const hud   = document.getElementById('hud');
      const s = e.data.state;

      // Clear spinner if present
      const old = document.getElementById('spinner');
      if (old) old.remove();

      dot.className = 'dot ' + s.toLowerCase();
      if (s === 'RECORDING') {
        label.textContent = 'Recording…';
      } else if (s === 'TRANSCRIBING') {
        dot.style.display = 'none';
        const sp = document.createElement('div');
        sp.id = 'spinner';
        sp.className = 'spinner transcribing';
        hud.insertBefore(sp, label);
        label.textContent = 'Transcribing…';
      } else if (s === 'INJECTING') {
        dot.style.display = 'none';
        const sp = document.createElement('div');
        sp.id = 'spinner';
        sp.className = 'spinner injecting';
        hud.insertBefore(sp, label);
        label.textContent = 'Pasting…';
      }
    });
  </script>
</body>
</html>
