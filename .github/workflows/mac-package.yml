name: Mac Package

# IMPORTANT: this workflow MUST NOT run on push/PR to branches (G24).
# Only workflow_dispatch (manual) and version tags trigger this.
# check:workflows (G24 gate) enforces this invariant automatically.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  mac-package:
    name: Build macOS package (ad-hoc signed)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm ci

      # Assert all CI gates pass before packaging
      - name: check:manifest (G14)
        run: npm run check:manifest

      - name: check:focus (G19)
        run: npm run check:focus

      - name: check:workflows (G24)
        run: npm run check:workflows

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: UI component tests
        run: npm run test:ui

      - name: Build (tsc)
        run: npm run build

      - name: Build UI (vite)
        run: npm run build:ui

      - name: Create resources/bin (mac CI — no Windows binaries)
        # resources/bin is gitignored; whisper-cli.exe and ggml models are Windows-only.
        # electron-builder's extraResources requires the source dir to exist.
        # The macOS build ships without bundled binaries — cloud transcription is the G23 smoke target.
        run: mkdir -p resources/bin

      - name: Package (electron-builder — dmg + zip, ad-hoc signed)
        run: npm run package
        env:
          # Suppress code-signing identity search; identity: null already set in package.json build.mac
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # G23-runner: verify the macOS bundle ON the GitHub cloud Mac (no physical Mac required).
      # Proves: .app exists, Mach-O binary present, ad-hoc codesign, Gatekeeper prep (xattr).
      # Human launch smoke (mic/UI) remains optional when DOM has Mac access.
      - name: G23-runner — verify macOS app bundle on cloud Mac
        run: |
          set -euo pipefail
          APP="$(find dist-installer -name '*.app' -maxdepth 4 | head -1)"
          if [ -z "$APP" ]; then
            echo "FAIL: no .app bundle under dist-installer"
            find dist-installer -maxdepth 4 -print
            exit 1
          fi
          echo "Found app bundle: $APP"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)"
          if [ -z "$BIN" ]; then
            echo "FAIL: no Mach-O binary in Contents/MacOS"
            exit 1
          fi
          echo "Mach-O binary: $BIN"
          file "$BIN"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/codesign.txt
          if ! grep -qi 'adhoc' /tmp/codesign.txt; then
            echo "WARN: expected ad-hoc signature (identity: null); continuing"
          fi
          xattr -cr "$APP"
          echo "xattr -cr OK (Gatekeeper prep)"
          ls -lh dist-installer/*.dmg dist-installer/*.zip
          echo "G23-runner PASS — macOS artifact built and verified on cloud Mac"

      - name: Artifact hygiene check
        run: |
          echo "=== Checking for .env files in dist-installer ==="
          if find dist-installer -name ".env" | grep -q .; then
            echo "FAIL: .env file found in artifact tree"
            exit 1
          fi
          echo "OK: no .env files"

          echo "=== Checking for absolute CI runner paths in artifact ==="
          if grep -rq "/Users/runner/" dist-installer/ 2>/dev/null; then
            echo "FAIL: absolute /Users/runner/ path found in artifact (path leak)"
            exit 1
          fi
          echo "OK: no absolute CI runner paths"

          echo "Hygiene PASS"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-speakflow-mac-dmg
          path: dist-installer/*.dmg
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-speakflow-mac-zip
          path: dist-installer/*.zip
          if-no-files-found: error
